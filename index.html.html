<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardware y Software · Actividad de repaso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10161f;
    --panel: #171f2b;
    --panel-2: #1d2635;
    --line: #2a3547;
    --text: #eef1f5;
    --text-dim: #93a0b3;
    --teal: #37d6b0;
    --teal-dim: #1c4a40;
    --coral: #ff6f5e;
    --coral-dim: #4a2521;
    --amber: #f2b544;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 48px 20px 80px;
  }
  .wrap{ width:100%; max-width:720px; }

  .chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.02em;
    color: var(--teal);
    background: var(--teal-dim);
    border:1px solid #2c5f52;
    padding:5px 11px;
    border-radius:4px;
  }
  .chip .dot{ width:6px;height:6px;border-radius:50%;background:var(--teal); }

  h1{
    font-size: 32px;
    font-weight:700;
    line-height:1.2;
    margin: 18px 0 6px;
  }
  .sub{
    color: var(--text-dim);
    font-size:15px;
    line-height:1.55;
    margin:0 0 32px;
    max-width: 58ch;
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom: 28px;
  }
  .progress-track{
    flex:1;
    height:6px;
    background: var(--panel-2);
    border-radius:3px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .progress-fill{
    height:100%;
    width:0%;
    background: var(--teal);
    transition: width .35s ease;
  }
  .progress-label{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color: var(--text-dim);
    white-space:nowrap;
  }

  .card{
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding: 28px 26px 26px;
  }

  .qcat{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color: var(--amber);
    letter-spacing:0.03em;
    margin-bottom:10px;
  }
  .qtext{
    font-size:19px;
    font-weight:500;
    line-height:1.4;
    margin: 0 0 22px;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    display:flex;
    align-items:flex-start;
    gap:12px;
    text-align:left;
    width:100%;
    background: var(--panel-2);
    border:1px solid var(--line);
    color: var(--text);
    font-family:inherit;
    font-size:15px;
    line-height:1.45;
    padding:13px 16px;
    border-radius:8px;
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .opt:hover:not(:disabled){
    border-color:#45536a;
    background:#212c3d;
  }
  .opt:disabled{ cursor:default; }
  .opt .letter{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color: var(--text-dim);
    border:1px solid var(--line);
    border-radius:4px;
    width:22px;
    height:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    margin-top:1px;
  }
  .opt.correct{
    background: var(--teal-dim);
    border-color:#2c5f52;
  }
  .opt.correct .letter{
    background: var(--teal);
    color:#062a22;
    border-color: var(--teal);
  }
  .opt.wrong{
    background: var(--coral-dim);
    border-color:#7a3a32;
  }
  .opt.wrong .letter{
    background: var(--coral);
    color:#3a0f09;
    border-color: var(--coral);
  }
  .opt.dim{ opacity:0.45; }

  .feedback{
    margin-top:20px;
    padding:14px 16px;
    border-radius:8px;
    font-size:14px;
    line-height:1.55;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.ok{
    background: var(--teal-dim);
    border:1px solid #2c5f52;
    color:#c9f3e8;
  }
  .feedback.no{
    background: var(--coral-dim);
    border:1px solid #7a3a32;
    color:#ffd9d3;
  }
  .feedback strong{ display:block; margin-bottom:4px; font-size:13px; font-family:'JetBrains Mono', monospace; letter-spacing:0.02em; }

  .footer-row{
    display:flex;
    justify-content:flex-end;
    margin-top:22px;
  }
  .next-btn{
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    font-size:14px;
    background: var(--teal);
    color:#062a22;
    border:none;
    padding:11px 22px;
    border-radius:7px;
    cursor:pointer;
    display:none;
  }
  .next-btn.show{ display:inline-block; }
  .next-btn:hover{ filter:brightness(1.06); }

  .result{
    display:none;
    text-align:center;
    padding: 20px 10px 4px;
  }
  .result.show{ display:block; }
  .result .score{
    font-size:56px;
    font-weight:700;
    font-family:'JetBrains Mono', monospace;
    margin: 6px 0 2px;
  }
  .result .score-of{ color: var(--text-dim); font-size:16px; margin-bottom:22px; }
  .result .msg{ font-size:15px; color: var(--text-dim); max-width:46ch; margin: 0 auto 26px; line-height:1.55; }
  .restart-btn{
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    font-size:14px;
    background: transparent;
    color: var(--text);
    border:1px solid var(--line);
    padding:11px 22px;
    border-radius:7px;
    cursor:pointer;
  }
  .restart-btn:hover{ border-color:#45536a; background:var(--panel-2); }

  .quiz-body.hidden{ display:none; }

  @media (max-width:480px){
    h1{ font-size:26px; }
    .card{ padding:22px 18px 20px; }
    .qtext{ font-size:17px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <span class="chip"><span class="dot"></span>ACTIVIDAD DE REPASO</span>
  <h1>Hardware y software</h1>
  <p class="sub">Diez preguntas para repasar qué es hardware, qué es software y cómo se clasifica cada uno. Elige una opción y recibe retroalimentación inmediata.</p>

  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">Pregunta 1 / 10</span>
  </div>

  <div class="card">
    <div class="quiz-body" id="quizBody">
      <div class="qcat" id="qcat"></div>
      <p class="qtext" id="qtext"></p>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="footer-row">
        <button class="next-btn" id="nextBtn">Siguiente pregunta</button>
      </div>
    </div>

    <div class="result" id="result">
      <div class="score" id="scoreNum">0/10</div>
      <div class="score-of" id="scoreLabel"></div>
      <p class="msg" id="scoreMsg"></p>
      <button class="restart-btn" id="restartBtn">Repetir actividad</button>
    </div>
  </div>

</div>

<script>
const questions = [
  {
    cat: "Conceptos básicos",
    text: "¿Cuál de las siguientes opciones define mejor el hardware?",
    options: [
      "El conjunto de programas e instrucciones que hacen funcionar un equipo",
      "Los componentes físicos y tangibles que forman un sistema informático",
      "Los datos que el usuario guarda en la nube",
      "El conjunto de reglas para conectarse a internet"
    ],
    correct: 1,
    feedback: "El hardware son las partes físicas que se pueden tocar: pantalla, teclado, procesador, memoria, etc. El software, en cambio, son las instrucciones que le indican al hardware qué hacer."
  },
  {
    cat: "Conceptos básicos",
    text: "¿Cuál de las siguientes opciones define mejor el software?",
    options: [
      "Los cables y conectores de una computadora",
      "Cualquier dispositivo que se pueda tocar y ver",
      "El conjunto de programas, aplicaciones y sistemas que permiten operar un equipo",
      "La fuente de poder de un computador"
    ],
    correct: 2,
    feedback: "El software es intangible: son programas, aplicaciones y sistemas operativos. Necesita del hardware para ejecutarse, pero no es un objeto físico."
  },
  {
    cat: "Clasificación de hardware",
    text: "El teclado, el mouse y el escáner pertenecen a la categoría de hardware de...",
    options: [
      "Salida",
      "Entrada",
      "Almacenamiento",
      "Procesamiento"
    ],
    correct: 1,
    feedback: "Los dispositivos de entrada permiten ingresar información al computador. El teclado, el mouse, el escáner y el micrófono son ejemplos clásicos."
  },
  {
    cat: "Clasificación de hardware",
    text: "El monitor, la impresora y las bocinas son ejemplos de hardware de...",
    options: [
      "Entrada",
      "Procesamiento",
      "Salida",
      "Almacenamiento interno"
    ],
    correct: 2,
    feedback: "Los dispositivos de salida muestran o entregan al usuario la información procesada: imagen en el monitor, documento impreso o sonido en las bocinas."
  },
  {
    cat: "Clasificación de hardware",
    text: "¿En qué categoría de hardware se ubican el disco duro, el SSD y una memoria USB?",
    options: [
      "Dispositivos de procesamiento",
      "Dispositivos de almacenamiento",
      "Dispositivos de entrada",
      "Periféricos de salida"
    ],
    correct: 1,
    feedback: "Los dispositivos de almacenamiento guardan la información de manera permanente o portátil: disco duro, SSD, memorias USB y tarjetas de memoria."
  },
  {
    cat: "Clasificación de hardware",
    text: "El CPU (procesador) y la memoria RAM forman parte del hardware de...",
    options: [
      "Entrada",
      "Salida",
      "Almacenamiento externo",
      "Procesamiento"
    ],
    correct: 3,
    feedback: "El hardware de procesamiento es el encargado de ejecutar las instrucciones y realizar cálculos. El procesador (CPU) y la memoria RAM son sus componentes principales."
  },
  {
    cat: "Clasificación de software",
    text: "El sistema operativo, como Windows o macOS, se clasifica como...",
    options: [
      "Software de aplicación",
      "Software de sistema",
      "Software de programación",
      "Hardware de procesamiento"
    ],
    correct: 1,
    feedback: "El software de sistema administra los recursos del equipo y permite que el hardware y los programas funcionen juntos. El sistema operativo es su ejemplo principal."
  },
  {
    cat: "Clasificación de software",
    text: "Un procesador de texto, un editor de fotos o un navegador web son ejemplos de...",
    options: [
      "Software de sistema",
      "Software de aplicación",
      "Firmware",
      "Hardware de entrada"
    ],
    correct: 1,
    feedback: "El software de aplicación son los programas que usa el usuario para realizar tareas específicas, como escribir, editar imágenes o navegar en internet."
  },
  {
    cat: "Clasificación de software",
    text: "Python, Java y C++ son ejemplos de software de...",
    options: [
      "Aplicación",
      "Sistema",
      "Programación",
      "Almacenamiento"
    ],
    correct: 2,
    feedback: "El software de programación incluye los lenguajes y herramientas que usan los desarrolladores para crear otros programas, como Python, Java o C++."
  },
  {
    cat: "Relación hardware-software",
    text: "¿Por qué se dice que hardware y software son complementarios?",
    options: [
      "Porque ambos son componentes físicos que se pueden reemplazar",
      "Porque el hardware no necesita instrucciones para funcionar",
      "Porque el software necesita del hardware para ejecutarse, y el hardware necesita del software para tener utilidad",
      "Porque el software reemplaza por completo la necesidad de hardware"
    ],
    correct: 2,
    feedback: "Ninguno funciona de forma útil sin el otro: el hardware es el cuerpo físico y el software son las instrucciones que le dan propósito y funcionalidad."
  }
];

let current = 0;
let score = 0;
let answered = false;

const qcatEl = document.getElementById('qcat');
const qtextEl = document.getElementById('qtext');
const optionsEl = document.getElementById('options');
const feedbackEl = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const quizBody = document.getElementById('quizBody');
const resultEl = document.getElementById('result');
const scoreNum = document.getElementById('scoreNum');
const scoreLabel = document.getElementById('scoreLabel');
const scoreMsg = document.getElementById('scoreMsg');
const restartBtn = document.getElementById('restartBtn');

const letters = ['A','B','C','D'];

function renderQuestion(){
  answered = false;
  const q = questions[current];
  qcatEl.textContent = q.cat;
  qtextEl.textContent = q.text;
  optionsEl.innerHTML = '';
  feedbackEl.className = 'feedback';
  feedbackEl.innerHTML = '';
  nextBtn.classList.remove('show');

  q.options.forEach((optText, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="letter">' + letters[i] + '</span><span>' + optText + '</span>';
    btn.addEventListener('click', () => selectAnswer(i));
    optionsEl.appendChild(btn);
  });

  progressFill.style.width = ((current) / questions.length * 100) + '%';
  progressLabel.textContent = 'Pregunta ' + (current + 1) + ' / ' + questions.length;
}

function selectAnswer(i){
  if(answered) return;
  answered = true;
  const q = questions[current];
  const buttons = optionsEl.querySelectorAll('.opt');

  buttons.forEach((btn, idx) => {
    btn.disabled = true;
    if(idx === q.correct){
      btn.classList.add('correct');
    } else if(idx === i){
      btn.classList.add('wrong');
    } else {
      btn.classList.add('dim');
    }
  });

  if(i === q.correct){
    score++;
    feedbackEl.classList.add('ok');
    feedbackEl.innerHTML = '<strong>Correcto</strong>' + q.feedback;
  } else {
    feedbackEl.classList.add('no');
    feedbackEl.innerHTML = '<strong>No es la respuesta correcta</strong>La opción correcta es "' + letters[q.correct] + '. ' + q.options[q.correct] + '". ' + q.feedback;
  }
  feedbackEl.classList.add('show');
  nextBtn.classList.add('show');
  progressFill.style.width = ((current + 1) / questions.length * 100) + '%';
}

nextBtn.addEventListener('click', () => {
  current++;
  if(current < questions.length){
    renderQuestion();
  } else {
    showResult();
  }
});

function showResult(){
  quizBody.classList.add('hidden');
  resultEl.classList.add('show');
  scoreNum.textContent = score + '/' + questions.length;
  scoreLabel.textContent = 'respuestas correctas';
  let msg;
  if(score === questions.length){
    msg = "Excelente. Dominas la diferencia entre hardware y software, y sabes clasificar sus tipos.";
  } else if(score >= questions.length * 0.7){
    msg = "Buen resultado. Tienes clara la mayoría de los conceptos; repasa las preguntas falladas para reforzar los detalles.";
  } else if(score >= questions.length * 0.4){
    msg = "Vas por buen camino. Conviene repasar las categorías de hardware (entrada, salida, almacenamiento, procesamiento) y de software (sistema, aplicación, programación).";
  } else {
    msg = "Es momento de repasar el tema con calma: revisa qué es hardware, qué es software y cómo se clasifica cada tipo antes de intentarlo de nuevo.";
  }
  scoreMsg.textContent = msg;
  progressFill.style.width = '100%';
  progressLabel.textContent = 'Actividad completada';
}

restartBtn.addEventListener('click', () => {
  current = 0;
  score = 0;
  resultEl.classList.remove('show');
  quizBody.classList.remove('hidden');
  renderQuestion();
});

renderQuestion();
</script>
</body>
</html>
